<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Login | Firebase Auth</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #e8f0ff, #f7f8fc);
            color: #202124;
        }
        .login-card {
            background: #fff;
            padding: 30px 22px;
            border-radius: 22px;
            box-shadow: 0 15px 50px rgba(32, 90, 90, 0.12);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        .logo {
            width: 64px;
            height: 64px;
            margin: 0 auto 20px;
            display: grid;
            place-items: center;
            border-radius: 18px;
            background: #f1f5ff;
            font-size: 30px;
        }
        h1 {
            font-size: 27px;
            margin-bottom: 10px;
        }
        .subtitle {
            font-size: 14px;
            color: #5f6368;
            margin-bottom: 25px;
            line-height: 1.5;
        }
        button {
            width: 100%;
            padding: 12px 22px;
            border: none;
            border-radius: 8px;
            background: #1a73e8;
            color: white;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            transition: background 0.2s;
        }
        button:hover {
            background: #1557b0;
        }
        button:disabled {
            opacity: 0.6;
            cursor: wait;
        }
        .google-icon {
            width: 20px;
            height: 20px;
        }
        #status {
            margin-top: 24px;
            font-size: 14px;
        }
        .error {
            color: #d93025;
        }
        .info {
            color: #5f6368;
        }
        .footer {
            margin-top: 28px;
            font-size: 12px;
            color: #80868b;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="logo">🚀</div>
        <h1>Welcome Back</h1>
        <p class="subtitle">Sign in with your Google account to access your dashboard.</p>
        
        <button id="loginButton">
            <svg class="google-icon" viewBox="0 0 24 24">
                <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.66-5.17 3.66-9.17z"/>
                <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.13 0-5.78-2.11-6.73-4.96H1.19v3.15C3.17 21.36 7.22 24 12 24z"/>
                <path fill="#FBBC05" d="M5.27 14.24c-.25-.72-.38-1.49-.38-2.24s.13-1.52.38-2.24V6.6H1.19C.43 8.13 0 9.87 0 12s.43 3.87 1.19 5.4l4.08-3.16z"/>
                <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.22 0 3.17 2.64 1.19 6.6l4.08 3.15c.95-2.85 3.6-4.96 6.73-4.96z"/>
            </svg>
            <span>Continue with Google</span>
        </button>

        <div id="status" class="info"></div>

        <div class="footer">
            Secure sign-in powered by Firebase Authentication
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { 
            getAuth, 
            signInWithPopup, 
            GoogleAuthProvider, 
            setPersistence, 
            browserLocalPersistence,
            onAuthStateChanged 
        } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

        // TODO: আপনার ফায়ারবেস কনফিগারেশন এখানে বসাবেন
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_AUTH_DOMAIN",
            projectId: "YOUR_PROJECT_ID",
            appId: "YOUR_APP_ID"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        const loginButton = document.getElementById("loginButton");
        const statusDiv = document.getElementById("status");

        function showStatus(message, type = "info") {
            statusDiv.textContent = message;
            statusDiv.className = type;
        }

        function redirectHome() {
            window.location.replace("home.html");
        }

        // ব্রাউজারে লগইন স্টেট চেক করা (Local Persistence)
        async function initializeAuth() {
            try {
                await setPersistence(auth, browserLocalPersistence);
                
                // ইউজার আগে থেকেই লগইন করা থাকলে সরাসরি হোমপেজে রিডিক্ট করবে
                onAuthStateChanged(auth, (user) => {
                    if (user) {
                        showStatus("You are already signed in. Redirecting...", "info");
                        loginButton.disabled = true;
                        redirectHome();
                    } else {
                        loginButton.disabled = false;
                        showStatus("You can securely sign in with Google.", "info");
                    }
                });
            } catch (error) {
                console.error("Firebase initialization error:", error);
                showStatus("Could not initialize authentication.", "error");
            }
        }

        initializeAuth();

        // গুগল লগইন পপআপ ট্রিগার
        const provider = new GoogleAuthProvider();

        loginButton.addEventListener("click", async () => {
            loginButton.disabled = true;
            showStatus("Signing in...", "info");

            try {
                await signInWithPopup(auth, provider);
                showStatus("Login successful. Redirecting...", "info");
                redirectHome();
            } catch (error) {
                console.error("Google sign-in error:", error);
                loginButton.disabled = false;
                
                if (error.code === "auth/popup-closed-by-user") {
                    showStatus("Sign-in window was closed. Please try again.", "error");
                } else if (error.code === "auth/unauthorized-domain") {
                    showStatus("This domain is not authorized in Firebase Authentication.", "error");
                } else {
                    showStatus("Sign-in failed. Please try again.", "error");
                }
            }
        });
    </script>
</body>
</html>
